<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farmikoulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d0e;--paper:#f6e7b8;--paper2:#ecd89a;--wood:#8b5a2b;--wood2:#4a2c14;--gold:#f2b632;--green:#4f9a3a;--red:#c8432f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:8px;color:var(--ink);font-family:'VT323',monospace;
  background:repeating-linear-gradient(45deg,#2f5126 0 10px,#2a4a22 10px 20px)}
#game{width:min(960px,calc(100vw - 16px),calc((100vh - 110px) * 320 / 208));display:flex;flex-direction:column;gap:6px}
#hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--wood);border:4px solid var(--wood2);padding:5px 8px;color:#fff3d0;font-size:22px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#coll{display:flex;gap:5px;flex:1;flex-wrap:wrap}
.slot{position:relative;width:44px;height:38px;background:#5e3a17;border:3px solid #3a2410;display:grid;place-items:center;cursor:pointer}
.slot canvas{image-rendering:pixelated;max-width:38px}
.slot.miss canvas{filter:brightness(0);opacity:.35}
.slot.miss{cursor:default}
.slot .cnt{position:absolute;right:1px;bottom:-4px;font-size:18px;color:#fff3d0;text-shadow:1px 1px 0 #000,-1px 1px 0 #000}
#stats{display:flex;gap:12px;white-space:nowrap}
#btns{display:flex;gap:4px}
.ib{font:inherit;font-size:20px;width:36px;height:34px;background:#f6e7b8;color:var(--ink);border:3px solid var(--wood2);cursor:pointer;box-shadow:0 3px 0 var(--wood2);padding:0}
.ib.off{opacity:.45;text-decoration:line-through}
#stage{position:relative;width:100%;aspect-ratio:320/208;border:4px solid var(--wood2);background:#74b84f;container-type:inline-size;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
#prompt{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none;font-size:clamp(14px,2.6cqw,22px)}
#prompt span{background:rgba(43,29,14,.85);color:#fff3d0;padding:0 .4em;white-space:nowrap}
#prompt button{pointer-events:auto;font:inherit;background:var(--gold);color:var(--ink);border:3px solid var(--wood2);padding:0 .5em;cursor:pointer;box-shadow:0 3px 0 var(--wood2);white-space:nowrap}
#toast{position:absolute;left:50%;top:6%;transform:translate(-50%,-30px);opacity:0;transition:.25s;background:var(--paper);border:3px solid var(--wood2);padding:.15em .7em;font-size:clamp(15px,2.8cqw,24px);pointer-events:none;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{z-index:16;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(25,15,5,.55);padding:3%}
.panel{background:var(--paper);border:4px solid var(--wood2);box-shadow:inset 0 0 0 3px var(--paper2),6px 6px 0 rgba(0,0,0,.4);padding:.6em 1em;width:100%;max-width:640px;max-height:100%;overflow:auto;font-size:clamp(16px,3.3cqw,28px);line-height:1.15;text-align:center}
.panel h2{font-family:'Press Start 2P',monospace;font-size:.75em;margin:.4em 0 .6em;line-height:1.4}
.panel p{margin:.35em 0}
.logo{font-family:'Press Start 2P',monospace;font-size:1.5em;color:var(--gold);text-shadow:3px 3px 0 var(--wood2),-1px -1px 0 var(--wood2);margin:.3em 0 .2em;letter-spacing:2px}
.logo span{color:#7ccf4f}
.logo.small{font-size:1.2em}
.sub{font-size:1em}
.row{display:flex;gap:.5em;justify-content:center;flex-wrap:wrap;margin:.5em 0 .2em}
.btn{font:inherit;background:#fff8e1;color:var(--ink);border:3px solid var(--wood2);padding:.15em .8em;cursor:pointer;box-shadow:0 4px 0 var(--wood2);transition:transform .05s}
.btn:active,.opt:active,.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.btn.big{background:var(--gold);font-size:1.1em}
.btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--red);outline-offset:2px}
#parade{width:min(80%,420px);image-rendering:pixelated;display:block;margin:.3em auto}
.help{text-align:left;padding-left:1.2em;margin:.3em 0}
.help li{margin:.2em 0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:.5em;border-bottom:3px dashed var(--wood);padding-bottom:.2em;margin-bottom:.4em;font-size:.95em}
.dots{display:flex;gap:4px}
.dot{width:.7em;height:.7em;border:2px solid var(--wood2);background:#fff8e1}
.dot.r{background:#6fcf4f}.dot.w{background:#e9654f}.dot.cur{background:var(--gold)}
.qtext{font-size:1.15em;margin:.4em 0 .6em;min-height:2.2em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.4em}
.opt{font:inherit;text-align:left;background:#fff8e1;color:var(--ink);border:3px solid var(--wood2);box-shadow:0 4px 0 var(--wood2);padding:.25em .5em;cursor:pointer;display:flex;gap:.4em;align-items:center}
.opt:hover:not(:disabled){background:#fff0bf}
.opt .k{display:inline-grid;place-items:center;min-width:1.2em;height:1.2em;background:var(--wood);color:#fff3d0;font-size:.8em}
.opt.right{background:#9be07a}.opt.wrong{background:#f2917e}
.opt:disabled{cursor:default}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin-top:.5em;min-height:1.8em;text-align:left}
#fb{flex:1}
#fb .good{color:#2e7d22;font-weight:bold}
#fb .bad{color:#a8321f}
#chestCv{width:min(45%,240px);image-rendering:pixelated;cursor:pointer;display:block;margin:0 auto}
.new{display:inline-block;background:#e9654f;color:#fff;padding:0 .3em;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.fact{font-size:.85em;background:#fff8e1;border:2px dashed var(--wood);padding:.2em .5em;margin:.4em auto;max-width:90%}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em;margin:.4em 0}
.stats div{background:#fff8e1;border:3px solid var(--wood2);padding:.1em}
.stats b{display:block;font-size:1.3em}
#touch{display:none}
body.phone{align-items:flex-start;padding:6px;overscroll-behavior:none}
body.phone #game{width:min(960px,calc(100vw - 12px),calc((100dvh - 270px) * 320 / 208));position:relative}
body.phone #touch{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;user-select:none;-webkit-user-select:none;touch-action:none}
#dpad{position:relative;width:138px;height:138px;border-radius:50%;background:rgba(43,29,14,.6);border:3px solid var(--wood2);touch-action:none;flex:none}
#dpad .ar{position:absolute;color:#fff3d0;font-size:20px;line-height:1;pointer-events:none}
#dpad .u{top:6px;left:50%;transform:translateX(-50%)}#dpad .d{bottom:6px;left:50%;transform:translateX(-50%)}
#dpad .l{left:8px;top:50%;transform:translateY(-50%)}#dpad .r{right:8px;top:50%;transform:translateY(-50%)}
#dpad .knob{position:absolute;width:52px;height:52px;border-radius:50%;background:var(--gold);border:3px solid var(--wood2);left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 3px 0 var(--wood2)}
#actBtn{width:88px;height:88px;border-radius:50%;background:var(--gold);border:4px solid var(--wood2);box-shadow:0 5px 0 var(--wood2);font-size:36px;touch-action:manipulation;flex:none;cursor:pointer}
#actBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--wood2)}
body.phone button,body.phone .opt{touch-action:manipulation}
body.phone>#modal{position:fixed;z-index:50;padding:10px}
body.phone .panel{font-size:clamp(16px,4.4vw,24px)!important;max-height:100%}
body.phone .opts{grid-template-columns:1fr}
body.phone .opt{padding:.45em .6em}
body.phone #bossCv{width:min(100%,460px)}body.phone #dodgeCv{width:min(100%,380px)}
@media (orientation:landscape){
  body.phone{padding:3px}
  body.phone #game{width:min(960px,calc(100vw - 12px),calc((100dvh - 62px) * 320 / 208));gap:3px}
  body.phone #hud{padding:2px 6px;gap:6px;font-size:16px;border-width:3px}
  body.phone #coll{gap:3px;flex-basis:auto}body.phone #stats{display:none}
  body.phone .slot{width:30px;height:27px;border-width:2px}body.phone .slot canvas{max-width:26px}
  body.phone .ib{width:28px;height:27px;font-size:14px;box-shadow:0 2px 0 var(--wood2)}
  body.phone #stage{border-width:3px}
  body.phone .panel{font-size:clamp(13px,4.4vh,20px)!important;padding:.4em .8em}
  body.phone .opts{grid-template-columns:1fr 1fr}
  body.phone #dodgeCv{width:auto;height:calc(100dvh - 9.5em);max-height:300px}body.phone #joy{width:110px;height:110px}body.phone .dodge #dMsg{margin:0;font-size:.75em}
  body.phone .panel h2{margin:.2em 0 .3em}
  body.phone #touch{position:absolute;left:0;right:0;bottom:4px;pointer-events:none;padding:0 6px}
  body.phone #touch>*{pointer-events:auto;opacity:.7}
  body.phone #dpad{width:112px;height:112px}body.phone #dpad .knob{width:42px;height:42px}
  body.phone #actBtn{width:72px;height:72px;font-size:30px}
  body.phone #foot{display:none}
}
#foot{color:#e8f5d0;text-align:center;font-size:20px;text-shadow:1px 1px 0 #000}
label.rpick{display:block;text-align:left;padding:.25em .4em;margin:.15em 0;border:2px solid #c9a46a;border-radius:4px;background:#fff8e6;cursor:pointer;font-size:.85em;line-height:1.25}
label.rpick:has(input:checked){background:#ffe08a;border-color:#8a5a2b}.rcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.rcols{grid-template-columns:1fr}}
#admBody{--ms:28px;--sq:max(26px,min(44px,calc((100vw - 60px)/8),calc((100dvh - 300px)/8)))}
body:not(.phone) #admBody{--sq:36px}body:not(.phone) #rcCv{height:290px}
.exGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:.3em 0}
.exCard{font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.6em .4em;background:#fff8e6;border:3px solid var(--wood2);box-shadow:0 3px 0 var(--wood2);cursor:pointer;color:var(--ink)}
.exCard:hover{background:#ffe9a8}.exCard .exE{font-size:2em;line-height:1.1}.exCard small{opacity:.75;font-size:.75em}
.exHead{display:flex;align-items:center;gap:10px;margin:.2em 0}
.exBoardWrap{display:flex;justify-content:center}.exBoard{display:grid;grid-template-columns:repeat(8,var(--sq));border:4px solid #5a3a1a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.exSq{width:var(--sq);height:var(--sq);padding:0;margin:0;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.exSq.lt{background:#f0d9a8}.exSq.dk{background:#b5824e}.exSq.lm{box-shadow:inset 0 0 0 100px rgba(255,230,80,.35)}.exSq.sel{box-shadow:inset 0 0 0 3px #2a7de1,inset 0 0 0 100px rgba(80,160,255,.35)}
.exSq.tg::after{content:'';width:30%;height:30%;border-radius:50%;background:rgba(30,90,30,.55);position:absolute}.exSq.cap::after{width:86%;height:86%;background:none;border:3px solid rgba(30,90,30,.7)}
.exSq.chk{box-shadow:inset 0 0 0 100px rgba(255,40,40,.55)}.exSq.mv{box-shadow:inset 0 0 0 3px rgba(255,230,80,.9)}
.pc{font-size:calc(var(--sq)*.78);line-height:1;font-family:'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols2',serif}.pc.w{color:#fff;text-shadow:0 0 1px #000,1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}.pc.b{color:#1a1a1a;text-shadow:0 0 1px #fff8}
.ckp{width:76%;height:76%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq)*.4);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3)}
.ckp.w{background:#f6efe0;border:2px solid #8a7a60}.ckp.b{background:#2a2420;border:2px solid #000}
.pkPay{max-width:340px;margin:.2em auto;font-size:.8em}.pkPay td{padding:1px 8px}
.pkHand{display:flex;justify-content:center;gap:6px;margin:.4em 0;flex-wrap:nowrap}
.pkC{font:inherit;width:min(62px,17vw);height:min(88px,24vw);background:#fff;border:3px solid #333;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;color:#111;box-shadow:0 3px 0 #333}
.pkC b{font-size:1.4em;line-height:1}.pkC span{font-size:1.5em;line-height:1}.pkC.red{color:#d1281f}.pkC.held{transform:translateY(-6px);border-color:#2a7de1;box-shadow:0 3px 0 #2a7de1}
.pkC em{position:absolute;bottom:-1.6em;font-style:normal;font-size:.6em;background:#2a7de1;color:#fff;padding:1px 4px}.pkC.back{background:repeating-linear-gradient(45deg,#c9995a 0 6px,#a8763e 6px 12px);font-size:1.6em}
#rcCv{height:max(220px,min(calc(100dvh - 330px),440px));image-rendering:pixelated;display:block;margin:.2em auto;border:3px solid var(--wood2)}
.rcCtl{display:flex;justify-content:center;gap:10px}.rcCtl .btn{touch-action:none;user-select:none;-webkit-user-select:none}#rcL,#rcR{font-size:1.4em;min-width:2.6em}
.msTop,.msBar{display:flex;justify-content:center;align-items:center;gap:10px;margin:.25em 0;flex-wrap:wrap}
.msBar>span{font-family:'Press Start 2P',ui-monospace,monospace;font-size:.75em;background:#2b1d0e;color:#ff5a4a;padding:4px 7px;border:2px solid #8a5a2b}
#msFace{font-size:1.3em;padding:0 .4em}#msMode.on{background:#ffb0a0}
.msWrap{overflow:auto;max-width:100%;display:flex;justify-content:center}
.msGrid{display:grid;gap:0;border:4px solid;border-color:#7b7b7b #fff #fff #7b7b7b;background:#bdbdbd;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.msC{width:var(--ms);height:var(--ms);padding:0;margin:0;font:bold calc(var(--ms)*.6)/1 'Press Start 2P',ui-monospace,monospace;background:#c6c6c6;border:3px solid;border-color:#fff #7b7b7b #7b7b7b #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.msC.o{border:1px solid #9a9a9a;background:#d9d9d9;cursor:default}.msC.boom{background:#ff4a3a}
body.phone #admBody{--ms:min(30px,calc((100vw - 70px)/9))}
#admBody:has(.msGrid[style*="repeat(12"]){--ms:min(26px,calc((100vw - 70px)/12))}
#admBody:has(.msGrid[style*="repeat(16"]){--ms:min(24px,calc((100vw - 64px)/16))}
#bLang{font-family:'Press Start 2P',monospace;font-size:10px}
.lives{letter-spacing:2px;white-space:nowrap}
.lives .lost{filter:grayscale(1);opacity:.35}
.pick{display:flex;gap:.4em;justify-content:center;align-items:center;flex-wrap:wrap;margin:.3em 0;font-size:.9em}
.pick .btn{padding:.05em .6em}
.pick .btn.on,.setRow .btn.on{background:#9be07a}
.redo{font-size:2em;margin:.1em 0}
.nameIn{font:inherit;font-size:1em;width:11em;max-width:60%;padding:.05em .4em;border:3px solid var(--wood2);background:#fff8e1;color:var(--ink)}
.nameIn:focus{outline:3px dashed var(--red);outline-offset:1px}
.lbTabs{display:flex;gap:.4em;justify-content:center;margin:.2em 0 .4em}
.lbTabs .btn.on{background:#9be07a}
.lb{width:100%;border-collapse:collapse;font-size:.8em;text-align:left}
.lbTabs .btn{font-size:.85em}
.lb th{border-bottom:3px solid var(--wood2);padding:.1em .3em;font-weight:normal;opacity:.8}
.lb td{padding:.1em .3em;border-bottom:1px dashed var(--wood)}
.lb tr.me td{background:#ffe9a8}
.lb td.r{text-align:right;white-space:nowrap}
.lb .medal{font-size:1.15em;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.35))}
.lb tr.m1 td{background:#fff1b8}.lb tr.m2 td{background:#eef0f3}.lb tr.m3 td{background:#f7e2cf}
.lb tr.me td{box-shadow:inset 0 -2px 0 var(--gold)}
.lbNote{font-size:.8em;opacity:.8}
.pinIn{width:8.5em}
.bad{color:#a8321f}
.adm td{padding:.1em .25em}
.adm .acts{white-space:nowrap}
.adm .acts .btn{font-size:.8em;padding:0 .35em;margin:0 1px;box-shadow:0 2px 0 var(--wood2)}
.adm .acts .btn.sure{background:#e9654f;color:#fff}
.adm input{font:inherit;width:5em;padding:0 .2em;border:2px solid var(--wood2)}
.admGrid{display:grid;grid-template-columns:1fr 1fr;gap:.4em;margin:.3em 0}
.admGrid .btn{font-size:.9em}
.admStats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;margin:.4em 0}
.admStats div{background:#fff8e1;border:3px solid var(--wood2);padding:.2em}.admStats b{display:block;font-size:1.4em}
.panel.admin{max-width:760px;font-size:clamp(13px,2.35cqw,20px)}
.panel.admin .lbTabs{flex-wrap:wrap;gap:.3em}.panel.admin .lbTabs .btn{font-size:.85em;padding:.05em .5em}
.panel.admin .admGrid .btn{font-size:.85em;padding:.1em .4em}
.panel.admin h2{margin:.2em 0 .4em}
.adminName{color:#d6201a;font-weight:bold;text-shadow:0 0 1px rgba(214,32,26,.35)}
#ctrlBan{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:12;background:#2b1d0e;color:#fff3d0;border:3px solid #d6201a;box-shadow:0 0 0 3px #2b1d0e,0 0 14px rgba(214,32,26,.7);
  padding:.15em .8em;font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.7cqw,15px);white-space:nowrap;pointer-events:none;animation:ctrlPulse 1.2s ease-in-out infinite}
#ctrlBan .adminName{color:#ff5a4f}
@keyframes ctrlPulse{50%{box-shadow:0 0 0 3px #2b1d0e,0 0 4px rgba(214,32,26,.3)}}
.credit{font-size:.8em;opacity:.75;margin:.4em 0 0}
#cmd{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(10,14,8,.92);border-top:3px solid #6fcf4f;color:#9dff7a;font-size:clamp(15px,2.6cqw,22px);padding:.2em .5em;font-family:'VT323',monospace}
#cmdLog{max-height:7.5em;overflow:auto;white-space:pre-wrap;line-height:1.1}
#cmdLog .err{color:#ff8a7a}#cmdLog .me{color:#d8e8d0;opacity:.75}
.cmdrow{display:flex;align-items:center;gap:.3em}
#cmdIn{flex:1;background:transparent;border:0;outline:0;color:#c8ffb0;font:inherit;caret-color:#9dff7a}
.tt small{opacity:.8}
#tirppa{position:absolute;right:1%;top:3%;width:min(36%,240px);z-index:15;background:rgba(43,29,14,.93);border:3px solid var(--gold);padding:.3em;display:flex;flex-direction:column;gap:.25em;font-size:clamp(13px,2.2cqw,19px);color:#fff3d0;box-shadow:4px 4px 0 rgba(0,0,0,.4)}
#tirppa .th{display:flex;justify-content:space-between;align-items:center;font-family:'Press Start 2P',monospace;font-size:.6em;color:var(--gold);padding:.2em}
#tirppa .th button{background:none;border:0;color:#fff3d0;font:inherit;font-size:1.4em;cursor:pointer}
.tt{font:inherit;text-align:left;background:#5e3a17;color:#fff3d0;border:2px solid #3a2410;padding:.15em .4em;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.3em}
.tt:hover{background:#73491f}.tt.on{background:#3f7a2f;border-color:#9be07a}
.tt b{font-weight:normal;font-size:.8em;background:rgba(0,0,0,.3);padding:0 .3em;white-space:nowrap}
.dWrap{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
#joy{width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,#f6e7b8 0 40%,#e2c98a 41% 100%);border:4px solid var(--wood2);box-shadow:0 4px 0 var(--wood2);position:relative;touch-action:none;flex:none;user-select:none;-webkit-user-select:none}
#joyK{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:#ffd34d;border:4px solid var(--wood2);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);pointer-events:none;transition:transform .08s}
#joy.on #joyK{transition:none;background:#ffe27a}
.dWrap #dodgeCv{margin:.2em 0}
#dodgeCv{width:min(72%,460px);image-rendering:pixelated;display:block;margin:.2em auto;touch-action:none;border:3px solid var(--wood2);background:#120a06}
.panel.dodge{max-width:700px}
#scare{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#5a0000 0%,#000 75%);pointer-events:none;animation:scareBg 1.4s forwards}
#scare canvas{height:88%;image-rendering:pixelated;animation:scareZoom 1.4s forwards;filter:drop-shadow(0 0 12px #ff2020)}

/* ---------- ÄÄNET ---------- */
let AC=null,master,musicGain,sfxGain,NB=null,musTimer=null,musStep=0,musNext=0;

let settings={music:true,sfx:true,lang:'fi',device:null,name:'',admin:null,devId:'',vol:80,shake:true,speedrun:false};
try{const s=JSON.parse(localStorage.getItem(OKEY));if(s)settings=Object.assign(settings,s);}catch(e){}
// Tämän laitteen tunniste: sen avulla peli tunnistaa muiden laitteiden (esim. ylläpitäjän) tekemät muutokset.
function devId(){if(!settings.devId){settings.devId=Math.random().toString(36).slice(2,10);saveSettings();}return settings.devId;}
function saveSettings(){try{localStorage.setItem(OKEY,JSON.stringify(settings));}catch(e){}}
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();

    musicGain=AC.createGain();musicGain.connect(master);

    applyVolumes();startMusic();
  }catch(e){AC=null;}
}
function applyVolumes(){
  if(AC){musicGain.gain.value=settings.music?.33:0;sfxGain.gain.value=settings.sfx?.55:0;master.gain.value=Math.max(0,Math.min(100,settings.vol==null?80:settings.vol))/100;}
  document.body.classList.toggle('noshake',settings.shake===false);
  $('#bMusic').classList.toggle('off',!settings.music);$('#bSfx').classList.toggle('off',!settings.sfx);
}
function tone(o){
  if(!AC)return;
  const {f=440,f2=null,d=.15,type='square',v=.3,vib=0,vibF=6,filt=null}=o;
  const dest=o.dest||sfxGain;const t0=o.at!=null?o.at:AC.currentTime+(o.t||0);
  const osc=AC.createOscillator();osc.type=type;osc.frequency.setValueAtTime(f,t0);
  if(f2)osc.frequency.exponentialRampToValueAtTime(f2,t0+d);
  const gn=AC.createGain();gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(v,t0+.012);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);

  if(filt){const bq=AC.createBiquadFilter();bq.type=filt.type||'bandpass';bq.frequency.value=filt.f;bq.Q.value=filt.q||1;osc.connect(bq);bq.connect(gn);}else osc.connect(gn);
  gn.connect(dest);osc.start(t0);osc.stop(t0+d+.05);
}
function noise(o){
  if(!AC)return;
  if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=rand()*2-1;}
  const {d=.1,v=.2,f=2000,q=1}=o;const dest=o.dest||sfxGain;const t0=o.at!=null?o.at:AC.currentTime+(o.t||0);
  const s=AC.createBufferSource();s.buffer=NB;const bq=AC.createBiquadFilter();bq.type='bandpass';bq.frequency.value=f;bq.Q.value=q;
  const gn=AC.createGain();gn.gain.setValueAtTime(v,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
  s.connect(bq);bq.connect(gn);gn.connect(dest);s.start(t0);s.stop(t0+d+.02);

function nf(n){const m=n.match(/^([A-G])(#?)(\d)$/);const idx={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0);return 440*Math.pow(2,((+m[3]+1)*12+idx-69)/12);}

  "D5 D5 E5 F#5 G5 F#5 E5 D5 C5 C5 E5 G5 E5 D5 C5 B4 B4 D5 G5 D5 C5 E5 A4 C5 B4 A4 G4 F#4 G4 - - -").split(' ');

const STEP=.19;

const BOSS_TRACK={step:.15,bass:['E2','A2','E2','B1','G2','C2','G2','B1'],
  mel:("E4 E4 G4 E4 B4 A4 G4 F#4 E4 E4 G4 E4 C5 B4 A4 B4 E4 E4 G4 E4 B4 A4 G4 F#4 G4 F#4 E4 D4 E4 - E4 - "+
  "B4 B4 C5 B4 A4 G4 A4 B4 C5 C5 B4 A4 G4 F#4 G4 A4 B4 - B4 C5 D5 C5 B4 A4 G4 F#4 D4 F#4 E4 - - -").split(' ')};
let musicMode='farm';
const FINAL_TRACK={mel:BOSS_TRACK.mel,bass:BOSS_TRACK.bass,step:.12};
const ROBOT_TRACK={mel:BOSS_TRACK.mel.map(n=>n==='-'?n:n.replace(/(\d)$/,d=>String(+d+1))),bass:BOSS_TRACK.bass,step:.1};
function setMusic(m){if(musicMode===m)return;musicMode=m;musStep=0;}
function startMusic(){musNext=AC.currentTime+.15;musTimer=setInterval(schedMusic,40);}
function schedMusic(){
  if(!AC)return;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){
    const T=musicMode==='boss'?BOSS_TRACK:musicMode==='final'?FINAL_TRACK:musicMode==='robot'?ROBOT_TRACK:FARM_TRACK,i=musStep%64,n=T.mel[i];
    if(n!=='-')tone({f:nf(n),at:musNext,d:T.step*.8,v:.11,type:'square',dest:musicGain});
    if(i%2===0){const root=nf(T.bass[Math.floor(i/8)]);const beat=(i%8)/2;tone({f:beat%2?root*1.5:root,at:musNext,d:T.step*1.7,v:.3,type:'triangle',dest:musicGain});}
    else noise({at:musNext,d:.03,v:musicMode!=='farm'?.1:.06,f:7000,dest:musicGain});
    if(musicMode!=='farm'&&i%(musicMode==='final'?2:4)===0)noise({at:musNext,d:.08,v:.22,f:150,dest:musicGain});
    musStep++;musNext+=T.step;
  }
}
const sfx={
  ui:()=>tone({f:660,d:.05,v:.12}),
  deny:()=>{tone({f:300,d:.08,v:.15});tone({f:230,d:.12,v:.15,t:.09});},

  const xb=panel.querySelector('.xbtn');
  if(progress&&!exitSure){exitSure=true;sfx.deny();if(xb){xb.classList.add('sure');xb.textContent=L('✕ Poistu? Edistys menetetään','✕ Leave? Progress is lost');}

  const wasBoss=modalType==='boss';closeModal();sfx.ui();

const PBKEY='farmikoulu-pb';
const fmtMs=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),sec=Math.floor(t%60),cs=Math.floor(t*100%100);return m+':'+String(sec).padStart(2,'0')+'.'+String(cs).padStart(2,'0');};
const fmtDiff=d=>(d<0?'−':'+')+(Math.abs(d)<60?Math.abs(d).toFixed(2):fmtMs(Math.abs(d)));
function pbAll(){try{return JSON.parse(localStorage.getItem(PBKEY)||'{}')||{};}catch(e){return {};}}
function pbKey(){return (ACC?ACC.id:'_')+'@'+(state.level||5);}
function pbGet(){return pbAll()[pbKey()]||null;}
function srPBLine(){const pb=pbGet();return settings.speedrun?`<p class="lbNote">🏅 PB (${esc(levelName(state.level))}): <b>${pb?fmtMs(pb.time):L('ei vielä','none yet')}</b></p>`:'';}
const SR_ICON=k=>k==='boss'?'👑':{sorsa:'🦆',possu:'🐷',kana:'🐔',lehma:'🐄',lammas:'🐑',peruna:'🥔'}[k]||'•';
let srFlash=[];
function srSplit(k){
  if(!state.sr||state.won)return;state.srSplits=state.srSplits||{};if(state.srSplits[k]!=null)return;
  const t=state.time||0;state.srSplits[k]=t;const pb=pbGet(),pt=pb&&pb.splits&&pb.splits[k];
  srFlash.unshift({k,t,d:pt!=null?t-pt:null,at:performance.now()});srFlash=srFlash.slice(0,3);save();
}
function srFinish(){
  if(!state.sr)return null;srSplit('boss');const t=state.time||0,pb=pbGet(),res={t,pb:pb?pb.time:null,newPB:false,cheated:!!state.cheated};
  if(!state.cheated&&(!pb||t<pb.time)){const all=pbAll();all[pbKey()]={time:t,splits:{...state.srSplits},date:new Date().toISOString().slice(0,10)};try{localStorage.setItem(PBKEY,JSON.stringify(all));}catch(e){}res.newPB=true;}
  return res;
}
let lastSr=null;
function renderSr(){
  const box=$('#srBox');if(!box)return;const show=!!settings.speedrun&&started&&!!ACC&&modalType!=='title';box.hidden=!show;if(!show)return;

}

/* ---------- TEHTÄVÄT ---------- */
const NEED=3,LIVES=3;
function openStation(st){
  if(modalType)return;
  if(st.id==='boss')return showBossIntro();
  if(st.id==='robot')return showRobotIntro();
  if(st.id==='stone')return showStone();
  if(state.last===st.id){toast(L('Tämä piste lepää. Tee välillä tehtävä toisella pisteellä!','This point is resting. Try another task point first!'));sfx.deny();return;}
  initAudio();sfx.ui();
  quiz={st,done:0,lives:LIVES,mistakes:0,q:null,answered:false,lastOk:false,seen:new Set(),slots:[]};
  quiz.q=freshQ();
  renderQuiz();
}
// Uusi kysymys tehtävään: ei toistoja saman tehtävän aikana, ja oikea vastaus on joka kerta eri kohdassa (1–4).
function freshQ(o=quiz,stId=quiz.st.id){
  let q;for(let n=0;n<15;n++){q=nextQ(stId);if(!o.seen.has(q.q))break;}
  o.seen.add(q.q);
  if(!o.slots.length)o.slots=shuffle([0,1,2,3]).filter(s=>s!==o.lastSlot);
  const slot=o.slots.pop();o.lastSlot=slot;
  const wrong=shuffle(q.opts.filter(o=>o!==q.correct));wrong.splice(slot,0,q.correct);q.opts=wrong;
  return q;
}
function livesHTML(){let h='';for(let i=0;i<LIVES;i++)h+=`<span class="${i<quiz.lives?'':'lost'}">❤️</span>`;return h;}
function dotsHTML(){let h='';for(let i=0;i<NEED;i++)h+=`<span class="dot ${i<quiz.done?'r':(i===quiz.done?'cur':'')}"></span>`;return h;}
function renderQuiz(){
  const q=quiz.q;
  openModal('quiz',`${exitBtn()}<div class="qhead"><span>${quiz.st.icon} ${L2(quiz.st.subject)}</span>
  <span class="dots" id="dots" title="${L('Oikeat vastaukset','Correct answers')}">${dotsHTML()}</span>
  <span class="lives" id="lives" title="${L('Yritykset','Tries')}">${livesHTML()}</span></div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>
  <div class="qfoot"><div id="fb"></div><button class="btn big" id="qNext" hidden></button></div>`);
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('#qNext').onclick=nextQuestion;
}
function answer(i){
  if(!quiz||quiz.answered)return;quiz.answered=true;
  const q=quiz.q,ok=q.opts[i]===q.correct;quiz.lastOk=ok;
  state.answered++;
  if(ok){state.correct++;quiz.done++;}else{quiz.lives--;quiz.mistakes++;}
  panel.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j]===q.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
  $('#fb').innerHTML=ok?`<span class="good">${pick(L(['Oikein!','Hienoa!','Mahtavaa!','Juuri niin!','Loistavaa!'],['Correct!','Great!','Awesome!','Exactly!','Brilliant!']))}</span>${q.ex?' '+esc(q.ex):''}`
    :`<span class="bad">${L('Ei aivan.','Not quite.')}</span> ${L('Oikea vastaus','Right answer')}: <b>${esc(q.correct)}</b>${q.ex?'. '+esc(q.ex):''}`;
  $('#dots').innerHTML=dotsHTML();$('#lives').innerHTML=livesHTML();
  ok?sfx.ok():sfx.bad();
  const n=$('#qNext');
  n.textContent=ok?(quiz.done>=NEED?L('Valmis ▶','Done ▶'):L('Seuraava ▶','Next ▶')):(quiz.lives<=0?L('Jatka ▶','Continue ▶'):L('Uusi kysymys ▶','New question ▶'));
  n.hidden=false;n.focus({preventScroll:true});
  if(SR()&&ok){const q0=quiz;setTimeout(()=>{if(quiz===q0&&quiz.answered&&modalType==='quiz')nextQuestion();},450);}
  updateHUD();save();
}
function nextQuestion(){
  if(!quiz||!quiz.answered)return;
  if(quiz.done>=NEED)return finishQuiz();
  if(quiz.lives<=0)return showRestart();
  quiz.q=freshQ();quiz.answered=false;renderQuiz();
}
function showRestart(){
  state.restarts++;save();sfx.deny();
  openModal('result',`<div class="redo">🔄</div><h2>${L('Yritykset loppuivat','Out of tries')}</h2>
  <p>${L('Kaikki 3 yritystä käytettiin. Tehtävä alkaa alusta uusilla kysymyksillä – sinä pystyt tähän!','All 3 tries were used. The task starts over with new questions – you can do it!')}</p>
  <div class="row"><button class="btn big" id="rRe">${L('Aloita alusta','Start over')}</button><button class="btn" id="rBack">${L('Takaisin farmille','Back to the farm')}</button></div>`);
  const st=quiz.st;
  bind('rRe',()=>{modalType=null;quiz=null;openStation(st);});
  bind('rBack',closeModal);
}
function finishQuiz(){
  const st=quiz.st,gold=quiz.mistakes===0;state.tasks++;state.last=st.id;

/* ---------- SYÖTE ---------- */
addEventListener('keydown',e=>{
  if(e.target&&(e.target.id==='cmdIn'||e.target.tagName==='INPUT'))return;
  const k=e.key.toLowerCase();
  if(modalType){
    if(k==='escape'){if(modalType==='title'&&started&&ACC){closeModal();e.preventDefault();return;}if(['quiz','boss','dodge'].includes(modalType))exitTask();else if(modalType==='settings'){const b=$('#sOk');if(b)b.click();}
    else if(['help','bossintro','board','admin'].includes(modalType)){if(modalType==='bossintro'&&robotForced()){e.preventDefault();return;}(started?closeModal():showTitle());}e.preventDefault();return;}
    if(modalType==='dodge'&&['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);e.preventDefault();return;}
    if(modalType==='quiz'&&quiz){
      if(['1','2','3','4'].includes(k)&&!quiz.answered){answer(+k-1);e.preventDefault();}
      else if(k==='enter'&&quiz.answered){nextQuestion();e.preventDefault();}
    }else if(modalType==='boss'&&fight){
      if(['1','2','3','4'].includes(k)&&!fight.answered&&fight.phase==='q'){bossAnswer(+k-1);e.preventDefault();}
      else if(k==='enter'&&fight.answered&&fight.phase==='q'){bossNext();e.preventDefault();}
    }else if(modalType==='chest'&&chest&&k==='enter'){
      if(chest.phase==='idle'){startChest();e.preventDefault();}else if(chest.revealed){closeChest();e.preventDefault();}
    }
    return;
  }
  if(k==='escape'){goMenu();e.preventDefault();return;}
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys.add(k);e.preventDefault();initAudio();}
  if((k==='e'||k===' '||k==='enter')&&nearSt){e.preventDefault();openStation(nearSt);}
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{
  if(modalType)return;initAudio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(state.farm!==2)for(const a of animals){const s=SPR[a.id];if(Math.abs(x-a.x)<s.w/2+2&&y>a.y-s.h-3&&y<a.y+3){ANIM[a.id].snd();a.wait=1.2;a.moving=false;
    parts.push({x:a.x,y:a.y-s.h-2,vx:0,vy:-16,life:1.2,max:1.2,kind:'heart'});return;}}
  for(const st of activeStations()){if(Math.abs(x-st.x)<(st.id==='boss'||st.id==='robot'?20:st.id==='stone'?12:15)&&y>st.y-st.h-2&&y<st.y+6){
    if(Math.hypot(P.x-st.x,P.y-(st.y+7))<(st.id==='boss'||st.id==='robot'?24:18)){openStation(st);return;}
    P.target={x:st.x,y:st.y+7};P.autoSt=st;P.stuck=0;return;}}
  P.target={x,y};P.autoSt=null;P.stuck=0;
});

let musClicks=[],musStart=null;

const TIR={big:false,flee:false};
const HEADS={player:{x:0,y:0,w:10,h:6},kana:{x:4,y:0,w:5,h:6},sorsa:{x:5,y:0,w:7,h:4},possu:{x:9,y:0,w:6,h:6},lehma:{x:11,y:0,w:6,h:7},lammas:{x:10,y:2,w:4,h:4},peruna:{x:0,y:0,w:10,h:8},kulta:{x:0,y:0,w:10,h:8}};
function bigHead(s,key,flip,dx,dy){
  const hr=HEADS[key];if(!hr)return;const hx=flip?s.w-hr.x-hr.w:hr.x,cx=dx+hx+hr.w/2,by=dy+hr.y+hr.h;
  ctx.drawImage(flip?s.f:s.c,hx,hr.y,hr.w,hr.h,Math.round(cx-hr.w),Math.round(by-hr.h*2),hr.w*2,hr.h*2);

function clampRegion(region,x,y){
  if(region==='pen')return {x:Math.max(228,Math.min(300,x)),y:Math.max(124,Math.min(194,y))};
  if(region==='field')return {x:Math.max(126,Math.min(194,x)),y:Math.max(158,Math.min(196,y))};
  if(region==='barnyard')return {x:Math.max(238,Math.min(298,x)),y:Math.max(72,Math.min(104,y))};
  const dx=(x-POND.cx)/(POND.rx*.62),dy=(y-4-POND.cy)/(POND.ry*.62),d=Math.hypot(dx,dy);
  return d<=1?{x,y}:{x:POND.cx+dx/d*POND.rx*.62,y:POND.cy+4+dy/d*POND.ry*.62};
}

let dodge=null;
const DB={x:40,y:62,w:120,h:80},D_TIME=45,D_HP=20;
const D_SAYS=[['Ranskalaissade!','French fry rain!'],['Perunat, vyöry!','Potatoes, roll!'],['Muusiaalto!','Mash wave!'],['Ranskalaismuuri!','Wall of fries!'],['KAIKKI KERRALLA!','EVERYTHING AT ONCE!']];

const DCFG={final:{time:45,hp:20,dmg:3,wave:9,waves:5},robot:{time:90,hp:20,dmg:4,wave:15,waves:6}};
const R_SAYS=[['AKTIVOIDAAN… BIIP BOOP.','ACTIVATING… BEEP BOOP.'],['Ranskalaistykit, tulta!','Fry cannons, fire!'],['LASERMUUSI!','MASH LASERS!'],['Ohjautuvat perunat laukaistu!','Homing potatoes launched!'],['YLIKUORMITUS!','OVERLOAD!'],['PERUNAATTORI 2000 EI HÄVIÄ!','PERUNAATTORI 2000 NEVER LOSES!']];
// Puhelimen joystick väistötaisteluihin (viimeinen muoto ja Perunaattori 2000)
function bindJoy(){
  const j=$('#joy'),k=$('#joyK');if(!j)return;let id=null;
  const set=e=>{const r=j.getBoundingClientRect(),R=r.width/2;let x=(e.clientX-r.left-R)/R*1.15,y=(e.clientY-r.top-R)/R*1.15;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}
    if(dodge)dodge.joy={x,y};k.style.transform=`translate(${x*R*.62}px,${y*R*.62}px)`;};
  const end=()=>{id=null;if(dodge)dodge.joy=null;k.style.transform='';j.classList.remove('on');};
  j.addEventListener('pointerdown',e=>{e.preventDefault();id=e.pointerId;try{j.setPointerCapture(id);}catch(_){}j.classList.add('on');set(e);});
  j.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>j.addEventListener(ev,e=>{if(e.pointerId===id)end();}));
}
function startDodge(mode){
  mode=mode==='robot'?'robot':'final';const cfg=DCFG[mode];
  closeCmd();if(modalType)closeModal();started=true;initAudio();setMusic(mode);sfx.bossRoar();
  dodge={mode,cfg,t:0,hp:cfg.hp,inv:0,px:DB.x+DB.w/2,py:DB.y+DB.h-10,bul:[],spawn:0,spawn2:0,ring:0,wall:0,laser:0,hom:0,phase:'play',end:0,lastWave:-1,target:null};
  const robot=mode==='robot';
  const forced=robot&&robotForced();dodge.forced=forced;
  openModal('dodge',`${forced?'':exitBtn()}<h2>${robot?'🤖 PERUNAATTORI 2000':L('Perunapomon viimeinen muoto','The Potato Boss: Final Form')}</h2>
  <div class="bars"><span>💚 ${L('Sinä','You')}</span><div class="bar"><div id="dHp" style="width:100%;background:#6fcf4f"></div></div>
  <span>⏱️ <b id="dT">${cfg.time}</b> s</span><div class="bar"><div id="dBar" style="width:100%;background:${robot?'#e9654f':'#4fa3e8'}"></div></div></div>
  <div class="dWrap"><canvas id="dodgeCv" width="200" height="150"></canvas>${isPhone()?`<div id="joy" aria-label="Joystick"><div id="joyK"></div></div>`:''}</div>
  <p id="dMsg" style="font-size:.85em;margin:.2em 0">${isPhone()?L(`Väistä! Ohjaa siementä joystickilla. Selviä ${cfg.time} sekuntia.`,`Dodge! Steer the seed with the joystick. Survive ${cfg.time} seconds.`):L(`Väistä! Liiku nuolilla / WASD tai vedä sormella. Selviä ${cfg.time} sekuntia.`,`Dodge! Move with arrows / WASD or drag. Survive ${cfg.time} seconds.`)}</p>`);
  bindJoy();
  const c=$('#dodgeCv');
  const setT=e=>{if(!dodge)return;const r=c.getBoundingClientRect();dodge.target={x:(e.clientX-r.left)/r.width*200,y:(e.clientY-r.top)/r.height*150};};
  c.addEventListener('pointerdown',e=>{setT(e);try{c.setPointerCapture(e.pointerId);}catch(_){}});
  c.addEventListener('pointermove',e=>{if(e.buttons)setT(e);});
  // Napautus: taimi liikkuu napautettuun kohtaan (ei pysähdy, kun sormi nousee).
}
function dSpawn(k,x,y,vx,vy){const sz={fry:[2,7],pot:[6,5],mash:[3,3],hom:[5,5]}[k];const b={k,x,y,vx,vy,w:sz[0],h:sz[1]};dodge.bul.push(b);return b;}
function dLaser(orient){const d=dodge,b={k:'laser',orient,warn:.75,life:.45};
  if(orient==='h'){b.x=DB.x;b.w=DB.w;b.h=6;b.y=Math.max(DB.y,Math.min(DB.y+DB.h-6,d.py-3+(rand()-.5)*30));}
  else{b.y=DB.y;b.h=DB.h;b.w=6;b.x=Math.max(DB.x,Math.min(DB.x+DB.w-6,d.px-3+(rand()-.5)*30));}
  b.vx=0;b.vy=0;d.bul.push(b);tone({f:1200,d:.08,v:.08,type:'square'});}
function dHoming(){const b=dSpawn('hom',DB.x+10+rand()*(DB.w-20),DB.y-6,0,30);b.life=6;}
// Perunaattori 2000:n aallot (15 s kukin)
function robotWaves(d,w){
  if(w===0&&d.spawn<=0){d.spawn=.15;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,75+rand()*35);}
  if(w===1){if(d.wall<=0){d.wall=1.0;dWall(62);}if(d.spawn2<=0){d.spawn2=.6;dPot(85);}}
  if(w===2){if(d.laser<=0){d.laser=1.1;dLaser(rand()<.5?'h':'v');}if(d.ring<=0){d.ring=1.5;dRing(11,60);}}
  if(w===3){if(d.hom<=0){d.hom=.7;dHoming();}if(d.spawn<=0){d.spawn=.35;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,80);}}
  if(w===4){if(d.ring<=0){d.ring=.9;dRing(13,70);}if(d.spawn<=0){d.spawn=.25;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,85+rand()*25);}if(d.laser<=0){d.laser=1.6;dLaser('v');}}
  if(w===5){if(d.spawn<=0){d.spawn=.2;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,90+rand()*30);}if(d.wall<=0){d.wall=1.4;dWall(66);}
    if(d.laser<=0){d.laser=1.3;dLaser(rand()<.5?'h':'v');}if(d.hom<=0){d.hom=.9;dHoming();}}
}
function dRing(n,speed){const off=(rand()-.5)*.3;for(let i=0;i<n;i++){const a=Math.PI*(.1+.8*i/(n-1))+off;dSpawn('mash',100,DB.y-4,Math.cos(a)*speed,Math.sin(a)*speed);}}
function dWall(speed){const gap=DB.x+8+rand()*(DB.w-40);for(let x=DB.x;x<DB.x+DB.w;x+=7)if(x<gap||x>gap+24)dSpawn('fry',x,DB.y-8,0,speed);}
function dPot(speed){const left=rand()<.5;dSpawn('pot',left?DB.x-6:DB.x+DB.w,DB.y+4+rand()*(DB.h-10),left?speed:-speed,0);}
function updateDodge(dt){
  const d=dodge;if(!d)return;
  d.inv=Math.max(0,d.inv-dt);
  if(d.phase==='play'){
    const cfg=d.cfg;d.t+=dt;const w=Math.min(cfg.waves-1,Math.floor(d.t/cfg.wave));

    if(d.mode!=='robot'&&w===2){if(d.ring<=0){d.ring=1.1;dRing(11,48);}if(d.spawn2<=0){d.spawn2=.8;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,60);}}
    if(d.mode!=='robot'&&w===3&&d.wall<=0){d.wall=1.3;dWall(44);}
    if(d.mode!=='robot'&&w===4){if(d.spawn<=0){d.spawn=.32;dSpawn('fry',DB.x+rand()*DB.w,DB.y-8,0,65+rand()*25);}if(d.spawn2<=0){d.spawn2=.9;dPot(75);}if(d.ring<=0){d.ring=1.7;dRing(9,55);}}
    // liike
    let mx=0,my=0;
    if(keys.has('arrowleft')||keys.has('a'))mx--;if(keys.has('arrowright')||keys.has('d'))mx++;
    if(keys.has('arrowup')||keys.has('w'))my--;if(keys.has('arrowdown')||keys.has('s'))my++;
    if(mx||my)d.target=null;
    if(!mx&&!my&&d.joy&&(d.joy.x||d.joy.y)){d.target=null;const jm=Math.min(1,Math.hypot(d.joy.x,d.joy.y));if(jm>.12){const a=Math.atan2(d.joy.y,d.joy.x),sp=72*Math.min(1,(jm-.12)/.7);d.px+=Math.cos(a)*sp*dt;d.py+=Math.sin(a)*sp*dt;}}
    if(!mx&&!my&&d.target){const vx=d.target.x-d.px,vy=d.target.y-d.py,dd=Math.hypot(vx,vy);if(dd>1.5){mx=vx/dd;my=vy/dd;}}
    const ml=Math.hypot(mx,my);if(ml){d.px+=mx/ml*72*dt;d.py+=my/ml*72*dt;}

      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(d.inv<=0&&!b.dead&&b.y+b.h>DB.y&&d.px+2>b.x&&d.px-2<b.x+b.w&&d.py+2>b.y&&d.py-2<b.y+b.h){
        d.hp-=cfg.dmg;d.inv=1;if(b.k!=='laser')b.dead=true;sfx.bossHit();const pn=panel;pn.classList.remove('shake');void pn.offsetWidth;pn.classList.add('shake');}}
    d.bul=d.bul.filter(b=>!b.dead&&b.y<DB.y+DB.h+10&&b.x>DB.x-12&&b.x<DB.x+DB.w+12);
    if(d.hp<=0){d.hp=0;d.phase='lose';setTimeout(dodgeLose,700);}
    else if(d.t>=cfg.time){d.phase='win';d.bul=[];sfx.win();}

function drawDodge(){
  const c=$('#dodgeCv');if(!c||!dodge)return;const g=c.getContext('2d'),d=dodge,tt=performance.now()/1000;g.imageSmoothingEnabled=false;
  R(g,0,0,200,150,'#120a06');

  const robot=d.mode==='robot',b=robot?SPR.robot:SPR.bossEvil,bob=Math.round(Math.sin(tt*(robot?6:3))*2);let sc=2;
  if(robot)for(let i=0;i<6;i++)R(g,(i*37+tt*40)%200,(i*23)%55,6,1,'#1f4a5a');

    g.drawImage(b.c,Math.round(100-b.w*sc/2),Math.round(4+bob+(2-sc)*b.h/2),b.w*sc,b.h*sc);g.restore();}

      else{R(g,q.x,q.y,q.w,q.h,'#ff3030');if(q.orient==='h')R(g,q.x,q.y+2,q.w,2,'#ffffff');else R(g,q.x+2,q.y,2,q.h,'#ffffff');}}
    else if(q.k==='hom'){R(g,q.x+1,q.y,3,5,'#9aa4ae');R(g,q.x,q.y+1,5,3,'#9aa4ae');R(g,q.x+2,q.y+2,1,1,'#ff3030');}
    else R(g,q.x,q.y,q.w,q.h,'#f6efe0');}
  if(!(d.inv>0&&Math.floor(tt*16)%2)){const s=SPR.sprout;g.drawImage(s.c,Math.round(d.px-s.w/2),Math.round(d.py-s.h/2));}

function cmdLog(t,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=t;const l=$('#cmdLog');l.append(d);while(l.children.length>40)l.firstChild.remove();l.scrollTop=l.scrollHeight;}
function openCmd(){const c=$('#cmd');keys.clear();if(c.hidden){c.hidden=false;if(!$('#cmdLog').children.length)cmdLog(L('Komentopalkki avattu. Kirjoita "apua" nähdäksesi komennot.','Command bar open. Type "help" to see the commands.'));}sfx.pop();setTimeout(()=>$('#cmdIn').focus(),20);}

$('#cmdX').onclick=closeCmd;
$('#cmdIn').addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Escape'){closeCmd();return;}
  if(e.key==='ArrowUp'&&cmdHist.length){cmdPos=Math.max(0,cmdPos-1);e.target.value=cmdHist[cmdPos];e.preventDefault();return;}
  if(e.key==='ArrowDown'&&cmdHist.length){cmdPos=Math.min(cmdHist.length,cmdPos+1);e.target.value=cmdHist[cmdPos]||'';e.preventDefault();return;}
  if(e.key==='Enter'){const v=e.target.value.trim();e.target.value='';if(!v)return;cmdHist.push(v);cmdPos=cmdHist.length;cmdLog('> '+v,'me');try{runCmd(v);}catch(err){cmdLog(String(err),'err');}}
});

function runCmd(raw){
  const [c,...args]=raw.toLowerCase().split(/\s+/),a=args[0];
  const ok=m=>cmdLog(m),err=m=>cmdLog(m,'err');
  if(['eläimet','elaimet','animals','anna','give','arkku','chest','kultaarkku','goldchest','pomo','boss','voita','win','sydämet','sydamet','hearts','aika','time','lepo','rest','nopeus','speed','kivi','stone'].includes(c)&&!state.won&&!state.cheated){

/* ---------- PÄIVITYS ---------- */
function blocked(x,y){
  if(x<6||x>314||y<18||y>205)return true;
  if(state.farm===2){for(const s of SOLIDS2)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;return false;}
  for(const s of SOLIDS)if(x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h)return true;
  const dx=(x-POND.cx)/(POND.rx-2),dy=(y-POND.cy)/(POND.ry-2);return dx*dx+dy*dy<1;
}
function update(dt){
  if(started&&!state.won&&!['title','help','board','settings'].includes(modalType)){state.time=(state.time||0)+dt;}
  if(!modalType){
    let dx=0,dy=0;
    if(keys.has('arrowleft')||keys.has('a'))dx--;if(keys.has('arrowright')||keys.has('d'))dx++;
    if(keys.has('arrowup')||keys.has('w'))dy--;if(keys.has('arrowdown')||keys.has('s'))dy++;
    if(dx||dy){P.target=null;P.autoSt=null;}
    else if(P.target){const vx=P.target.x-P.x,vy=P.target.y-P.y,d=Math.hypot(vx,vy);
      if(d<1.5){P.target=null;if(P.autoSt){const s=P.autoSt;P.autoSt=null;openStation(s);}}else{dx=vx/d;dy=vy/d;}}
    const len=Math.hypot(dx,dy);
    if(len&&!modalType){
      dx/=len;dy/=len;const sp=64*SPEED*(fxOn('slow')?.5:1)*dt,nx=P.x+dx*sp,ny=P.y+dy*sp;let moved=false;
      if(!blocked(nx,P.y)){P.x=nx;moved=moved||Math.abs(dx)>.05;}
      if(!blocked(P.x,ny)){P.y=ny;moved=moved||Math.abs(dy)>.05;}
      if(Math.abs(dx)>.1)P.flip=dx<0;P.walkT+=dt;P.moving=true;
      if(!moved&&P.target){P.stuck+=dt;if(P.stuck>.35){const s=P.autoSt;P.target=null;P.autoSt=null;if(s&&Math.hypot(P.x-s.x,P.y-(s.y+7))<26)openStation(s);}}else P.stuck=0;
    }else P.moving=false;
    let best=null,bd=18;for(const st of activeStations()){const d=Math.hypot(P.x-st.x,P.y-(st.y+7))-(st.id==='boss'||st.id==='robot'?8:0);if(d<bd){bd=d;best=st;}}
    if(best!==nearSt){nearSt=best;renderPrompt();}
    // Salainen pikseli lammikon vieressä alareunassa: päälle astuminen = perunajumpscare.
    const sd=state.farm===2?99:Math.hypot(P.x-SECRET_PX.x,P.y-SECRET_PX.y);
    if(sd<4&&SECRET_PX.armed){SECRET_PX.armed=false;keys.clear();P.target=null;potatoScare();}
    else if(sd>9)SECRET_PX.armed=true;
  }else P.moving=false;
  for(const a of animals){
    a.t+=dt;if(a.jump>0)a.jump=Math.max(0,a.jump-dt);if(a.fleeing>0)a.fleeing-=dt;
    if(TIR.flee&&!modalType){const fx=a.x-P.x,fy=a.y-P.y,fd=Math.hypot(fx,fy)||1;
      if(fd<44){const c=clampRegion(ANIM[a.id].region,a.x+fx/fd*26,a.y+fy/fd*26);a.tx=c.x;a.ty=c.y;a.wait=0;a.fleeing=.7;}}
    if(a.wait>0){a.wait-=dt;a.moving=false;continue;}
    const vx=a.tx-a.x,vy=a.ty-a.y,d=Math.hypot(vx,vy);
    if(d<1){a.wait=.8+rand()*2.8;const p=randPt(ANIM[a.id].region);a.tx=p.x;a.ty=p.y;a.moving=false;}
    else{const sp=Math.min(ANIM[a.id].speed*(a.fleeing>0?5:1)*dt,d);a.x+=vx/d*sp;a.y+=vy/d*sp;if(Math.abs(vx)>.3)a.flip=vx<0;a.moving=true;}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='confetti'){p.vx+=Math.sin(p.y*.1)*2*dt*10;}else if(p.kind==='spark')p.vy+=60*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0&&p.y<H+5);
}
function renderPrompt(){
  const pr=$('#prompt');
  if(!nearSt||modalType){pr.hidden=true;return;}
  const st=nearSt;pr.style.left=(st.x/W*100)+'%';
  if(st.id==='robot'){pr.innerHTML=`<span>🤖 PERUNAATTORI 2000</span><button>${L('Taistele!','Fight!')} [E]</button>`;pr.querySelector('button').onclick=()=>openStation(st);}
  else if(st.id==='stone'){pr.innerHTML=`<span>🪨 ${L('Salaperäinen kivi','Mysterious stone')}</span><button>${L('Tutki','Inspect')} [E]</button>`;pr.querySelector('button').onclick=()=>openStation(st);}
  else if(st.id==='boss'){pr.innerHTML=`<span>👑 ${L2(st.name)}</span><button>${state.boss==='beaten'?L('Uusintaottelu!','Rematch!'):L('Taistele!','Fight!')} [E]</button>`;pr.querySelector('button').onclick=()=>openStation(st);}
  else if(state.last===st.id)pr.innerHTML=`<span>${L2(st.name)} ${L('lepää 💤 – kokeile toista pistettä','is resting 💤 – try another point')}</span>`;
  else{pr.innerHTML=`<span>${st.icon} ${L2(st.subject)}</span><button>${L('Tee tehtävä','Do the task')} [E]</button>`;pr.querySelector('button').onclick=()=>openStation(st);}
  if(isPhone())pr.innerHTML=pr.innerHTML.replace(' [E]',' ✋');
  pr.hidden=false;
  // Vinkki heti kohteen yläpuolelle. Jos se ei mahdu (kaivo, liitutaulu), se tulee heti pelaajan jalkojen alle.
  const sw=$('#stage').clientWidth,half=pr.offsetWidth/2;

  else{pr.style.top=(above/H*100)+'%';pr.style.transform='';}
}

async function pinHash(id,pin,salt){
  const enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);

  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function flushCloud(){

  if(ACCDB!==LOCALDB){try{const rs=await fetchRemote();
    if(isForeignNewer(rs)){if(applyRemote(rs)){cloudBusy=false;return;}cloudDirty=true;cloudBusy=false;cloudTimer=setTimeout(flushCloud,4000);return;}}catch(e){}}

let PK=null;
const PK_PAY=[['royal',['Kuningasvärisuora','Royal flush'],250],['sflush',['Värisuora','Straight flush'],50],['four',['Neloset','Four of a kind'],25],['full',['Täyskäsi','Full house'],9],['flush',['Väri','Flush'],6],['straight',['Suora','Straight'],4],['three',['Kolmoset','Three of a kind'],3],['two',['Kaksi paria','Two pair'],2],['jacks',['Jätkäpari tai parempi','Jacks or better'],1]];
const PK_KEY='farmikoulu-pokeri';

function pkSave(){try{localStorage.setItem(PK_KEY,String(PK.cr));}catch(e){}}

function pkEval(h){const rs=h.map(c=>c.r).sort((a,b)=>a-b),cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);const v=Object.values(cnt).sort((a,b)=>b-a);
  const flush=h.every(c=>c.s===h[0].s),uniq=v.length===5,wheel=rs.join()==='2,3,4,5,14',straight=uniq&&(rs[4]-rs[0]===4||wheel);
  if(straight&&flush)return rs[0]===10?'royal':'sflush';if(v[0]===4)return 'four';if(v[0]===3&&v[1]===2)return 'full';if(flush)return 'flush';if(straight)return 'straight';
  if(v[0]===3)return 'three';if(v[0]===2&&v[1]===2)return 'two';if(v[0]===2){const pr=+Object.keys(cnt).find(k=>cnt[k]===2);if(pr>=11)return 'jacks';}return null;}
const pkRank=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
function pkDeal(){if(PK.phase==='draw')return pkDraw();if(PK.cr<PK.bet){sfx.deny();return toast(L('Ei tarpeeksi pelimerkkejä.','Not enough credits.'));}
  PK.cr-=PK.bet;PK.deck=pkDeck();PK.hand=PK.deck.splice(0,5);PK.hold=[false,false,false,false,false];PK.phase='draw';PK.res=null;PK.win=0;

(function(){
  const pad=$('#dpad'),knob=pad.querySelector('.knob'),DIRS=['arrowup','arrowdown','arrowleft','arrowright'];
  let pid=null;
  const clear=()=>{DIRS.forEach(k=>keys.delete(k));knob.style.transform='translate(-50%,-50%)';};
  const set=e=>{const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),max=r.width/2-20;
    if(d>max){dx*=max/d;dy*=max/d;}knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
    DIRS.forEach(k=>keys.delete(k));if(d<12)return;const a=Math.atan2(dy,dx);
    if(Math.abs(Math.cos(a))>.38)keys.add(dx>0?'arrowright':'arrowleft');if(Math.abs(Math.sin(a))>.38)keys.add(dy>0?'arrowdown':'arrowup');
    P.target=null;P.autoSt=null;};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();pid=e.pointerId;try{pad.setPointerCapture(pid);}catch(_){}set(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e);});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(ev,e=>{if(e.pointerId===pid){pid=null;clear();}});

})();

  FIELDS2.forEach((f,i)=>ctx.drawImage(state.crops[CROPS[i].id]?f.full:f.plow,f.x,f.y));
  const ents=[];
  for(const st of STATIONS2)ents.push({y:st.y,d:()=>{shadow(st.x,st.y+1,st.kind==='tractor'?22:12);ctx.drawImage(st.img,st.x-20,st.y-42);}});
  pushRobot(ents,tt);
  ents.push({y:P.y,d:()=>{const fr=P.moving?(Math.floor(P.walkT*8)%2?1:2):0,s=SPR.player[fr],px=Math.round(P.x-s.w/2),py=Math.round(P.y-s.h);shadow(P.x,P.y,s.w);ctx.drawImage(P.flip?s.f:s.c,px,py);if(TIR.big)bigHead(s,'player',P.flip,px,py);if(state.crown)drawCrown(P.x,py-(TIR.big?9:0));}});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
  if(started)for(const st of STATIONS2){if(st===nearSt&&!modalType)continue;
    if(state.last===st.id){const z=Math.floor(tt*2)%2;R(ctx,st.x+6,st.y-st.h-6-z*2,3,1,'#ffffff');R(ctx,st.x+7,st.y-st.h-5-z*2,1,1,'#ffffff');R(ctx,st.x+6,st.y-st.h-4-z*2,3,1,'#ffffff');continue;}
    const y=Math.round(st.y-st.h-14+Math.sin(tt*4+st.x)*1.5);R(ctx,st.x-3,y-1,7,11,'#3a2414');R(ctx,st.x-2,y,5,9,'#fff6d5');R(ctx,st.x-1,y+1,3,4,'#d6332b');R(ctx,st.x-1,y+6,3,2,'#d6332b');}
  if(P.target&&!modalType){const b=Math.floor(tt*6)%2;R(ctx,P.target.x-2-b,P.target.y,2,1,'#fff6d5');R(ctx,P.target.x+1+b,P.target.y,2,1,'#fff6d5');}
  for(const p of parts){const al=Math.min(1,p.life/p.max*1.5);ctx.globalAlpha=al;
    if(p.kind==='heart')ctx.drawImage(SPR.heart.c,Math.round(p.x-2),Math.round(p.y));
    else if(p.kind==='confetti')R(ctx,p.x,p.y,2,1,p.color);else R(ctx,p.x,p.y,1,1,p.color);ctx.globalAlpha=1;}
}

/* ---------- PIIRTO ---------- */
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(Math.round(x-w/2+1),Math.round(y-1),w-2,2);}
function draw(){
  if(state.farm===2)return drawFarm2();
  ctx.drawImage(BG,0,0);
  const tt=performance.now()/1000;
  for(let i=0;i<4;i++){const k=(tt*.35+i/4)%1,sy=9-k*26,sx=63+Math.sin(k*6+i)*3+k*6,sz=2+Math.round(k*3);
    ctx.globalAlpha=.75*(1-k);R(ctx,sx-sz/2,sy-sz/2,sz,sz,'#e8e8e8');}ctx.globalAlpha=1;
  for(let i=0;i<6;i++){const a=tt*.4+i*1.7;R(ctx,POND.cx+Math.cos(a*1.3+i)*POND.rx*.55,POND.cy+Math.sin(a+i*2)*POND.ry*.5,2,1,'#bfe6ff');}
  const ents=[];
  for(const st of STATIONS)ents.push({y:st.y,d:()=>{shadow(st.x,st.y+1,st.kind==='tree'?14:12);ctx.drawImage(st.img,st.x-20,st.y-42);}});
  for(const a of animals)ents.push({y:a.y,d:()=>{
    const s=SPR[a.id],img=a.flip?s.f:s.c,x=Math.round(a.x-s.w/2),jy=a.jump>0?Math.round(Math.sin(a.jump/.6*Math.PI)*14):0;
    if(a.fleeing>0&&TIR.flee){R(ctx,a.x+s.w/2,a.y-s.h-4-jy,1,3,'#9fd3f2');R(ctx,a.x+s.w/2,a.y-s.h-6-jy,1,1,'#ffffff');}
    if(ANIM[a.id].region==='pond'){const y=Math.round(a.y);const b=Math.round(Math.sin(a.t*3))-jy;ctx.drawImage(img,0,0,s.w,s.h-3,x,y-s.h+3+b,s.w,s.h-3);R(ctx,x-1,y+b,s.w+2,1,'#bfe6ff');if(TIR.big)bigHead(s,a.id,a.flip,x,y-s.h+3+b);return;}
    const hop=a.moving?((a.id==='peruna'||a.id==='kulta')?Math.round(Math.abs(Math.sin(a.t*10))*2):(Math.floor(a.t*6)%2)):0,dy=Math.round(a.y-s.h-hop)-jy;
    shadow(a.x,a.y,s.w);ctx.drawImage(img,x,dy);if(TIR.big)bigHead(s,a.id,a.flip,x,dy);
    if(a.id==='kulta'&&Math.floor(a.t*4)%3===0)R(ctx,x+ri(0,s.w),dy+ri(0,s.h),1,1,'#fffbe0');}});
  if(state.stone){stoneRise=Math.min(1,stoneRise+1/50);const im=STONE_IMG,hgt=Math.round(im.height*stoneRise);
    ents.push({y:STONE.y,d:()=>{shadow(STONE.x,STONE.y,16);ctx.drawImage(im,0,0,im.width,hgt,STONE.x-im.width/2,STONE.y-hgt+1,im.width,hgt);
      if(stoneRise>=1){const gl=.55+Math.sin(tt*3)*.45;ctx.globalAlpha=gl;R(ctx,STONE.x,STONE.y-12,1,6,'#8ff0ff');R(ctx,STONE.x-1,STONE.y-11,3,1,'#8ff0ff');R(ctx,STONE.x-2,STONE.y-10,5,1,'#8ff0ff');ctx.globalAlpha=1;
        if(Math.floor(tt*5)%4===0)R(ctx,STONE.x+ri(-7,7),STONE.y-ri(2,14),1,1,'#d8fbff');}}});
    if(stoneRise<1&&Math.floor(tt*20)%2)R(ctx,STONE.x+ri(-10,10),STONE.y-ri(0,4),2,1,'#8a6a3a');}
  pushRobot(ents,tt);
  if(bossOnFarm()){bossRise=Math.min(1,bossRise+1/60);const s=SPR.boss,bob=Math.round(Math.sin(tt*3)*1.5),hgt=Math.round(s.h*2*bossRise);
    ents.push({y:BOSS.y,d:()=>{shadow(BOSS.x,BOSS.y,s.w*2);ctx.drawImage(s.c,0,0,s.w,hgt/2,BOSS.x-s.w,BOSS.y-hgt+bob,s.w*2,hgt);}});}
  ents.push({y:P.y,d:()=>{const fr=P.moving?(Math.floor(P.walkT*8)%2?1:2):0,s=SPR.player[fr],px=Math.round(P.x-s.w/2),py=Math.round(P.y-s.h);shadow(P.x,P.y,s.w);ctx.drawImage(P.flip?s.f:s.c,px,py);
    if(TIR.big)bigHead(s,'player',P.flip,px,py);if(state.crown)drawCrown(P.x,py-(TIR.big?9:0));}});
  R(ctx,SECRET_PX.x-1,SECRET_PX.y-1,3,3,'#64a344');
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.d());
  if(started)for(const st of STATIONS){if(st===nearSt&&!modalType)continue;if(state.last===st.id){const z=Math.floor(tt*2)%2;R(ctx,st.x+6,st.y-st.h-6-z*2,3,1,'#ffffff');R(ctx,st.x+7,st.y-st.h-5-z*2,1,1,'#ffffff');R(ctx,st.x+6,st.y-st.h-4-z*2,3,1,'#ffffff');continue;}
    const y=Math.round(st.y-st.h-14+Math.sin(tt*4+st.x)*1.5);R(ctx,st.x-3,y-1,7,11,'#3a2414');R(ctx,st.x-2,y,5,9,'#fff6d5');R(ctx,st.x-1,y+1,3,4,'#d6332b');R(ctx,st.x-1,y+6,3,2,'#d6332b');}
  if(state.stone&&!state.stoneSeen&&stoneRise>=1){const y=Math.round(STONE.y-STONE.h-14+Math.sin(tt*5)*2);R(ctx,STONE.x-3,y-1,7,11,'#3a2414');R(ctx,STONE.x-2,y,5,9,'#8ff0ff');R(ctx,STONE.x-1,y+1,3,4,'#1b4a6a');R(ctx,STONE.x-1,y+6,3,2,'#1b4a6a');}
  if(bossOnFarm()&&started&&bossRise>=1){const y=Math.round(BOSS.y-BOSS.h-16+Math.sin(tt*5)*2);R(ctx,BOSS.x-3,y-1,7,11,'#3a2414');R(ctx,BOSS.x-2,y,5,9,'#ffd34d');R(ctx,BOSS.x-1,y+1,3,4,'#d6332b');R(ctx,BOSS.x-1,y+6,3,2,'#d6332b');}
  if(P.target&&!modalType){const b=Math.floor(tt*6)%2;R(ctx,P.target.x-2-b,P.target.y,2,1,'#fff6d5');R(ctx,P.target.x+1+b,P.target.y,2,1,'#fff6d5');}
  for(const p of parts){const al=Math.min(1,p.life/p.max*1.5);ctx.globalAlpha=al;
    if(p.kind==='heart')ctx.drawImage(SPR.heart.c,Math.round(p.x-2),Math.round(p.y));
    else if(p.kind==='confetti')R(ctx,p.x,p.y,2,1,p.color);else R(ctx,p.x,p.y,1,1,p.color);ctx.globalAlpha=1;}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);draw();
  if(modalType==='chest')drawChest(dt);
  if(modalType==='boss'||modalType==='bossintro')updateFight(dt);
  if(modalType==='dodge')updateDodge(dt);
  if(modalType==='title'||modalType==='win')drawParade();
  renderSr();
  requestAnimationFrame(loop);
}
addEventListener('pagehide',()=>{if(started)save();flushCloud();});
rebuildAnimals();applyVolumes();applyDevice();showTitle();requestAnimationFrame(loop);
</script>
</body>
